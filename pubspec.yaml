name: user
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
    sdk: '>=3.1.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^1.0.3
  get: ^4.6.5
  percent_indicator: ^4.2.2
  shared_preferences: ^2.0.15
  firebase_analytics: ^11.3.3
  firebase_core: ^3.6.0
  google_sign_in: ^6.1.0
  firebase_auth: ^5.3.1
  connectivity_plus: ^4.0.2
  #  flutter_facebook_auth: ^3.5.3
  #  flutter_facebook_login: ^3.0.0
  dio: ^5.3.2
  permission_handler: ^10.4.3
  image_picker: ^1.0.2
  image_cropper: ^5.0.0
  flutter_image_compress: ^2.0.4
  email_validator: ^2.0.1
  mobile_number: ^2.1.1
  sms_autofill: ^2.4.1
  material_design_icons_flutter: ^7.0.7296
  geolocator: ^9.0.2
  geocoding: ^2.0.4
  cached_network_image: ^3.2.1
  shimmer: ^3.0.0
  razorpay_flutter: ^1.3.4
  # flutter_paystack: ^1.0.7  # Temporarily disabled - incompatible with current Flutter version
  carousel_slider: ^5.0.0
  dots_indicator: ^3.0.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^15.1.3
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.1.2
  google_maps_flutter: ^2.1.5
  flutter_mapbox_autocomplete:
    git:
      url: https://github.com/thiagoadriano/flutter_mapbox_autocomplete.git
  mapbox_search: ^3.0.1+2
  flutter_rating_bar: ^4.0.1
  share_plus: ^7.1.0
  photo_view: ^0.14.0
  flutter_polyline_points_plus: ^3.0.0
  badges: ^3.0.2
  sign_in_with_apple: ^7.0.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  timeline_tile: ^2.0.0  # Alternative to timelines package
  readmore: 2.2.0
  marquee: ^2.2.2
  flutter_speed_dial: ^7.0.0
  provider: 6.0.5
  google_maps_webservice: ^0.0.19
  google_fonts: ^6.2.1


dependency_overrides:
  intl: ^0.18.0
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0

  win32: ^5.5.0
  intl: ^0.18.0
  http: ^1.1.0

flutter_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/icon.png"

flutter:
  generate: true
  uses-material-design: true

  # Assets
  assets:
    - assets/
    - assets/images/

  # Fonts
  fonts:
    - family: Google-Sans
      fonts:
        - asset: assets/fonts/ProductSans-Regular.ttf

# Localization configuration at root level
l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart
  output-dir: lib/generated/l10n
  synthetic-package: false



